name: Dependency stack QA

on:
  push:
    branches:
      - main
      - master
      - refactor
  pull_request:
  schedule:
    # The scheduled run is the fullest regression tier.  All source refs
    # still come from the immutable defaults below.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      release_certification:
        description: 'Require explicit full SHAs for the complete source stack'
        required: false
        type: boolean
        default: false
      antitrust_ref:
        description: 'antitrust development bootstrap ref (ignored for certification)'
        required: false
        type: string
        default: 'master'
      antitrust_release_sha:
        description: 'Full 40-character antitrust candidate SHA'
        required: false
        type: string
      coordination_ref:
        description: 'coordination development bootstrap ref (ignored for certification)'
        required: false
        type: string
        default: 'main'
      coordination_release_sha:
        description: 'Full 40-character coordination candidate SHA'
        required: false
        type: string
      trade_ref:
        description: 'trade development bootstrap ref (ignored for certification)'
        required: false
        type: string
        default: 'master'
      trade_release_sha:
        description: 'Full 40-character trade candidate SHA'
        required: false
        type: string
      vertical_ref:
        description: 'vertical development bootstrap ref (ignored for certification)'
        required: false
        type: string
        default: 'main'
      vertical_release_sha:
        description: 'Full 40-character vertical candidate SHA'
        required: false
        type: string
      test_tier:
        description: 'Regression depth'
        required: true
        type: choice
        options:
          - FAST
          - EXTENDED
          - NIGHTLY
        default: FAST

permissions:
  contents: read

jobs:
  dependency-stack:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Bootstrap runs use moving refs and record the resolved commits.
      # Certification accepts the separately named full-SHA inputs only.
      RELEASE_CERTIFICATION: ${{ inputs.release_certification && 'true' || 'false' }}
      ANTITRUST_REF: ${{ inputs.release_certification && inputs.antitrust_release_sha || inputs.antitrust_ref || 'master' }}
      COORDINATION_REF: ${{ inputs.release_certification && inputs.coordination_release_sha || inputs.coordination_ref || 'main' }}
      TRADE_REF: ${{ inputs.release_certification && inputs.trade_release_sha || inputs.trade_ref || 'master' }}
      VERTICAL_REF: ${{ inputs.release_certification && inputs.vertical_release_sha || inputs.vertical_ref || 'main' }}
      TEST_TIER: ${{ github.event_name == 'schedule' && 'NIGHTLY' || inputs.test_tier || 'FAST' }}
      R_LIBS_USER: ${{ github.workspace }}/.ci/R-lib
      SOURCE_ROOT: ${{ github.workspace }}/.ci/src
      BUILD_ROOT: ${{ github.workspace }}/.ci/build
      LOG_ROOT: ${{ github.workspace }}/.ci/logs
      PROVENANCE_FILE: ${{ github.workspace }}/.ci/provenance.txt

    steps:
      # actions/checkout v4.2.2, pinned to its release commit.
      - name: Checkout competitiontoolbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # setup-r v2 is the stable major of r-lib/actions. Internal packages
      # are installed from the resolved local source trees below; dependency
      # provisioning reads their DCF fields and filters every stack package
      # before asking CRAN to resolve third-party dependencies.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Validate dependency refs for release certification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            for item in "antitrust:$ANTITRUST_REF" "coordination:$COORDINATION_REF" "trade:$TRADE_REF" "vertical:$VERTICAL_REF"; do
              name="${item%%:*}"
              sha="${item#*:}"
              if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release certification requires an explicit full 40-character ${name} SHA; mutable refs such as main/refactor are rejected." >&2
                exit 1
              fi
            done
          fi

      - name: Initialize isolated library and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R_LIBS_USER" "$SOURCE_ROOT" "$BUILD_ROOT" "$LOG_ROOT"
          {
            echo "event=${CI_EVENT_NAME:-${{ github.event_name }}}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_attempt=${{ github.run_attempt }}"
            echo "requested_antitrust_ref=$ANTITRUST_REF"
            echo "requested_coordination_ref=$COORDINATION_REF"
            echo "requested_trade_ref=$TRADE_REF"
            echo "requested_vertical_ref=$VERTICAL_REF"
            echo "release_certification=$RELEASE_CERTIFICATION"
            echo "competitiontoolbox_sha=$(git rev-parse HEAD)"
            echo "r_version=$(Rscript -e 'cat(R.version.string)')"
            echo "test_tier=$TEST_TIER"
          } | tee "$PROVENANCE_FILE"

      - name: Resolve dependency source refs
        shell: bash
        run: |
          set -euo pipefail

          case "$TEST_TIER" in
            FAST|EXTENDED|NIGHTLY) ;;
            *)
              echo "Unsupported test tier: $TEST_TIER" >&2
              exit 2
              ;;
          esac
          echo "COMPETITIONTOOLBOX_TEST_TIER=$TEST_TIER" >> "$GITHUB_ENV"

          # Clone without a checkout, resolve the bootstrap ref or explicit
          # certification SHA to a commit, then detach at that commit. Every
          # resolved SHA is recorded for auditability.
          clone_at_ref() {
            local repository="$1"
            local requested_ref="$2"
            local destination="$3"
            local commit=""
            local candidate=""

            git clone --quiet --no-checkout --filter=blob:none \
              "https://github.com/${repository}.git" "$destination"

            # A no-checkout clone stores branches under origin/*, while a
            # commit or tag may resolve directly.  Try each supported form.
            for candidate in \
              "$requested_ref" \
              "refs/remotes/origin/${requested_ref#refs/heads/}" \
              "refs/tags/${requested_ref#refs/tags/}"; do
              if commit="$(git -C "$destination" rev-parse --verify \
                  --end-of-options "${candidate}^{commit}" 2>/dev/null)"; then
                break
              fi
              commit=""
            done

            if [[ -z "$commit" ]]; then
              echo "Cannot resolve $repository ref '$requested_ref'" >&2
              exit 1
            fi

            git -C "$destination" checkout --quiet --detach "$commit"
            local resolved_sha
            resolved_sha="$(git -C "$destination" rev-parse --verify HEAD)"
            test "$resolved_sha" = "$commit"
            printf '%s' "$resolved_sha"
          }

          ANTITRUST_SHA="$(clone_at_ref luciu5/antitrust "$ANTITRUST_REF" "$SOURCE_ROOT/antitrust")"
          COORDINATION_SHA="$(clone_at_ref luciu5/coordination "$COORDINATION_REF" "$SOURCE_ROOT/coordination")"
          TRADE_SHA="$(clone_at_ref luciu5/trade "$TRADE_REF" "$SOURCE_ROOT/trade")"
          VERTICAL_SHA="$(clone_at_ref luciu5/vertical "$VERTICAL_REF" "$SOURCE_ROOT/vertical")"

          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            if [[ "$ANTITRUST_SHA" != "${ANTITRUST_REF,,}" || "$COORDINATION_SHA" != "${COORDINATION_REF,,}" || "$TRADE_SHA" != "${TRADE_REF,,}" || "$VERTICAL_SHA" != "${VERTICAL_REF,,}" ]]; then
              echo "A checked-out dependency SHA differs from its explicit release candidate input" >&2
              exit 1
            fi
            Rscript --vanilla - "${ANTITRUST_SHA,,}" "${COORDINATION_SHA,,}" "${TRADE_SHA,,}" "${VERTICAL_SHA,,}" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          desc <- read.dcf("DESCRIPTION")[1L, ]
          entries <- trimws(strsplit(desc[["Remotes"]], ",", fixed = TRUE)[[1L]])
          parsed <- lapply(entries, function(entry) {
            match <- regexec("^luciu5/([^/@]+)@([[:xdigit:]]{40})$", entry, perl = TRUE)
            parts <- regmatches(entry, match)[[1L]]
            if (length(parts) != 3L) stop("Malformed or mutable DESCRIPTION Remote: ", entry)
            setNames(tolower(paste0("luciu5/", parts[2L], "@", parts[3L])), parts[2L])
          })
          actual <- unlist(parsed, use.names = TRUE)
          names <- c("antitrust", "coordination", "trade", "vertical")
          expected <- setNames(paste0("luciu5/", names, "@", tolower(args[1:4])), names)
          if (length(actual) != length(expected) || !setequal(names(actual), names(expected)) ||
              any(actual[names(expected)] != expected)) {
            stop("DESCRIPTION Remotes do not match the four exact release candidate SHAs")
          }
          RSCRIPT
          fi

          {
            echo "resolved_antitrust_sha=$ANTITRUST_SHA"
            echo "resolved_coordination_sha=$COORDINATION_SHA"
            echo "resolved_trade_sha=$TRADE_SHA"
            echo "resolved_vertical_sha=$VERTICAL_SHA"
          } | tee -a "$PROVENANCE_FILE"

          {
            echo "ANTITRUST_SHA=$ANTITRUST_SHA"
            echo "COORDINATION_SHA=$COORDINATION_SHA"
            echo "TRADE_SHA=$TRADE_SHA"
            echo "VERTICAL_SHA=$VERTICAL_SHA"
            echo "ANTITRUST_SRC=$SOURCE_ROOT/antitrust"
            echo "COORDINATION_SRC=$SOURCE_ROOT/coordination"
            echo "TRADE_SRC=$SOURCE_ROOT/trade"
            echo "VERTICAL_SRC=$SOURCE_ROOT/vertical"
          } >> "$GITHUB_ENV"

      - name: Provision explicit third-party CRAN dependencies
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla - "$ANTITRUST_SRC" "$COORDINATION_SRC" \
            "$TRADE_SRC" "$VERTICAL_SRC" "$GITHUB_WORKSPACE" \
            <<'RSCRIPT' 2>&1 | tee "$LOG_ROOT/install-cran-dependencies.log"
          args <- commandArgs(trailingOnly = TRUE)
          if (length(args) != 5L) stop("Expected the four selected upstream sources and toolbox source")
          internal <- c(
            "antitrust", "coordination", "trade", "vertical",
            "competitiontoolbox", "financial", "antitrustBayes"
          )
          base_packages <- c(
            "R", "base", "compiler", "datasets", "graphics", "grDevices",
            "grid", "methods", "parallel", "splines", "stats", "stats4",
            "tcltk", "tools", "utils"
          )
          required_fields <- c("Depends", "Imports", "LinkingTo")
          # Source-level Suggests are installed for this test job, while their
          # transitive dependencies stay limited to required package fields.
          fields <- c(required_fields, "Suggests")
          specs <- character()
          for (source in args) {
            description <- read.dcf(file.path(source, "DESCRIPTION"))
            for (field in intersect(fields, colnames(description))) {
              value <- description[1L, field]
              if (!is.na(value) && nzchar(trimws(value))) {
                specs <- c(specs, strsplit(value, ",", fixed = TRUE)[[1L]])
              }
            }
          }
          direct <- trimws(specs)
          direct <- sub("\\s*\\(.*$", "", direct)
          direct <- trimws(sub("\\s+.*$", "", direct))
          direct <- setdiff(unique(direct[nzchar(direct)]), c(internal, base_packages))

          repos <- c(CRAN = "https://cloud.r-project.org")
          options(repos = repos)
          available <- available.packages(repos = repos)
          installed <- rownames(installed.packages())
          unresolved <- setdiff(direct, c(rownames(available), installed))
          if (length(unresolved)) {
            stop("Third-party DESCRIPTION dependencies are unavailable from CRAN and are not installed: ",
                 paste(unresolved, collapse = ", "))
          }

          requested <- intersect(direct, rownames(available))
          closure <- if (length(requested)) {
            tools::package_dependencies(
              requested,
              db = available,
              which = required_fields,
              recursive = TRUE
            )
          } else {
            list()
          }
          closure_names <- unique(unlist(closure, use.names = FALSE))
          forbidden <- intersect(closure_names, internal)
          if (length(forbidden)) {
            stop("A third-party CRAN dependency would pull an internal stack package: ",
                 paste(forbidden, collapse = ", "))
          }
          unresolved_closure <- setdiff(closure_names,
                                       c(rownames(available), installed, base_packages))
          if (length(unresolved_closure)) {
            stop("Third-party dependency closure contains packages unavailable from CRAN: ",
                 paste(unresolved_closure, collapse = ", "))
          }
          to_install <- setdiff(unique(c(requested, closure_names)),
                                c(installed, internal, base_packages))
          if (length(to_install)) {
            install.packages(
              to_install,
              lib = Sys.getenv("R_LIBS_USER"),
              repos = repos,
              dependencies = FALSE,
              quiet = FALSE
            )
          }
          missing <- direct[!vapply(direct, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) {
            stop("Third-party dependencies remain unavailable after CRAN provisioning: ",
                 paste(missing, collapse = ", "))
          }
          cat("Provisioned third-party CRAN dependencies:\n")
          cat(paste(sort(direct), collapse = "\n"), "\n")
          cat("Internal source packages excluded from CRAN resolution:\n")
          cat(paste(internal, collapse = ", "), "\n")
          RSCRIPT

      - name: Install dependency stack in order
        shell: bash
        run: |
          set -euo pipefail

          install_source() {
            local package_name="$1"
            local source_path="$2"
            echo "Installing $package_name from $source_path"
            R CMD INSTALL --clean --no-multiarch \
              --library="$R_LIBS_USER" "$source_path" \
              2>&1 | tee -a "$LOG_ROOT/install-${package_name}.log"
          }

          # Install each selected internal package directly from its exact
          # checkout, in dependency order. No Remotes-aware installer runs.
          install_source antitrust "$ANTITRUST_SRC"
          install_source coordination "$COORDINATION_SRC"
          Rscript -e 'required <- c("stackelberg_logit_h", "stackelberg_ces_multipliers"); missing <- setdiff(required, getNamespaceExports("coordination")); if (length(missing)) stop(sprintf("coordination ref %s resolved to %s and does not export %s; for release certification set coordination_ref to the full SHA that includes these public helpers", Sys.getenv("COORDINATION_REF"), Sys.getenv("COORDINATION_SHA"), paste(missing, collapse = ", ")), call. = FALSE)'
          install_source trade "$TRADE_SRC"
          install_source vertical "$VERTICAL_SRC"

          # Install the toolbox itself last from the checked-out candidate.
          R CMD INSTALL --clean --no-multiarch \
            --library="$R_LIBS_USER" "$GITHUB_WORKSPACE" \
            2>&1 | tee -a "$LOG_ROOT/install-competitiontoolbox.log"

          {
            echo "installed_antitrust_version=$(Rscript -e 'cat(as.character(packageVersion("antitrust")))')"
            echo "installed_coordination_version=$(Rscript -e 'cat(as.character(packageVersion("coordination")))')"
            echo "installed_trade_version=$(Rscript -e 'cat(as.character(packageVersion("trade")))')"
            echo "installed_vertical_version=$(Rscript -e 'cat(as.character(packageVersion("vertical")))')"
            echo "installed_competitiontoolbox_version=$(Rscript -e 'cat(as.character(packageVersion("competitiontoolbox")))')"
          } | tee -a "$PROVENANCE_FILE"

          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            Rscript --vanilla - "$ANTITRUST_SRC" "$COORDINATION_SRC" "$TRADE_SRC" "$VERTICAL_SRC" "$GITHUB_WORKSPACE" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          packages <- c("antitrust", "coordination", "trade", "vertical", "competitiontoolbox")
          for (i in seq_along(packages)) {
            expected <- unname(read.dcf(file.path(args[[i]], "DESCRIPTION"))[1L, "Version"])
            actual <- unname(as.character(utils::packageVersion(packages[[i]])))
            if (!identical(actual, expected)) stop(packages[[i]], " installed version ", actual, " differs from selected source ", expected)
          }
          stopifnot(utils::packageVersion("antitrust") >= "0.99.43",
                    utils::packageVersion("coordination") >= "0.1.0",
                    utils::packageVersion("trade") >= "0.9.0",
                    utils::packageVersion("vertical") >= "0.3.0")
          RSCRIPT
          fi

      - name: Build and run toolbox FAST checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT/toolbox" "$BUILD_ROOT/check"

          build_options=(--keep-empty-dirs --no-manual --no-build-vignettes)
          (
            cd "$BUILD_ROOT/toolbox"
            R CMD build "${build_options[@]}" "$GITHUB_WORKSPACE"
          ) 2>&1 | tee "$LOG_ROOT/competitiontoolbox-build.log"

          toolbox_tarball="$(find "$BUILD_ROOT/toolbox" -maxdepth 1 -type f \
            -name 'competitiontoolbox_*.tar.gz' -print -quit)"
          test -n "$toolbox_tarball"
          echo "TOOLBOX_TARBALL=$toolbox_tarball" >> "$GITHUB_ENV"

          # R CMD check runs the ordinary unit and high-value integration
          # tests in tests/testthat as part of its standard test phase.
          R CMD check \
            --library="$R_LIBS_USER" \
            --output="$BUILD_ROOT/check" \
            --no-manual --no-vignettes --no-build-vignettes \
            "$toolbox_tarball" \
            2>&1 | tee "$LOG_ROOT/competitiontoolbox-check-fast.log"

          # Run the same route/parity suite directly against the source tree
          # so failures retain testthat context in the CI log.
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)' \
            2>&1 | tee "$LOG_ROOT/competitiontoolbox-testthat-fast.log"

      - name: Run EXTENDED parity and upstream regression checks
        if: env.TEST_TIER == 'EXTENDED' || env.TEST_TIER == 'NIGHTLY'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT/upstream" "$BUILD_ROOT/upstream-check"

          check_upstream() {
            local package_name="$1"
            local source_path="$2"
            local package_build="$BUILD_ROOT/upstream/$package_name"
            local package_check="$BUILD_ROOT/upstream-check/$package_name"
            mkdir -p "$package_build" "$package_check"

            local build_options=(--keep-empty-dirs)
            local check_options=(--library="$R_LIBS_USER" --output="$package_check")
            if [[ "$TEST_TIER" == EXTENDED ]]; then
              # Extended runs donttest sections and rebuilds vignettes, while
              # avoiding manual generation that is not a solver/runtime test.
              build_options+=(--no-manual)
              check_options+=(--no-manual --run-donttest --timings)
            else
              # Nightly is the fullest meaningful package regression setting.
              check_options+=(--as-cran --run-donttest --timings)
            fi

            (
              cd "$package_build"
              R CMD build "${build_options[@]}" "$source_path"
            ) 2>&1 | tee "$LOG_ROOT/${package_name}-build.log"
            local package_tarball
            package_tarball="$(find "$package_build" -maxdepth 1 -type f \
              -name "${package_name}_*.tar.gz" -print -quit)"
            test -n "$package_tarball"
            R CMD check "${check_options[@]}" "$package_tarball" \
              2>&1 | tee "$LOG_ROOT/${package_name}-check-${TEST_TIER,,}.log"
          }

          # These checks exercise upstream unit tests, examples, donttest
          # solver cases, and (where present) vignettes against the exact
          # source stack used by the toolbox.
          check_upstream antitrust "$ANTITRUST_SRC"
          check_upstream coordination "$COORDINATION_SRC"
          check_upstream trade "$TRADE_SRC"
          check_upstream vertical "$VERTICAL_SRC"

          # The toolbox parity suite is mandatory in both non-FAST tiers.
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)' \
            2>&1 | tee "$LOG_ROOT/competitiontoolbox-testthat-${TEST_TIER,,}.log"

      - name: Run NIGHTLY full toolbox check
        if: env.TEST_TIER == 'NIGHTLY'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT/nightly-check"
          R CMD check \
            --library="$R_LIBS_USER" \
            --output="$BUILD_ROOT/nightly-check" \
            --as-cran --run-donttest --timings \
            "$TOOLBOX_TARBALL" \
            2>&1 | tee "$LOG_ROOT/competitiontoolbox-check-nightly.log"

      - name: Show provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat "$PROVENANCE_FILE"

      # actions/upload-artifact v4.6.2, pinned to its release commit.
      - name: Upload provenance and CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-stack-provenance-${{ github.run_id }}
          path: |
            .ci/provenance.txt
            .ci/logs
          if-no-files-found: error
          retention-days: 30
